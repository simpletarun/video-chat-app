<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Chat App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Video Call + Chat</h1>
    <div class="status-bar">
      <span id="statusIndicator" class="status-dot offline"></span>
      <span id="statusText">Disconnected</span>
      <span id="roomIndicator" class="room-pill hidden"></span>
    </div>
  </div>

  <div class="join-bar">
    <input type="text" id="roomInput" placeholder="Room name" maxlength="40" value="lobby" />
    <input type="text" id="nameInput" placeholder="Your display name" maxlength="20" />
    <button id="joinBtn">Join Room</button>
  </div>

  <div class="video-section">
    <div class="video-card">
      <h3 id="localLabel">You</h3>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="video-card">
      <h3 id="remoteLabel">Remote User</h3>
      <video id="remoteVideo" autoplay playsinline></video>
      <div id="remoteStatus" class="remote-status hidden">No one connected</div>
    </div>
  </div>

  <div class="controls">
    <button id="callBtn">📞 Start Call</button>
    <button id="endCallBtn" class="danger" disabled>✖ End Call</button>
    <button id="muteBtn" disabled>🎤 Mute</button>
    <button id="videoBtn" disabled>📹 Video Off</button>
  </div>

  <div class="online-users">
    <h3>Online in room <span id="roomCount" class="count">0</span></h3>
    <ul id="userList"></ul>
    <p class="hint">Tip: click a user to select them as the call target.</p>
  </div>

  <div class="chat-box">
    <div id="messages"></div>
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type message..." maxlength="500" />
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<div id="incomingCallModal" class="modal hidden">
  <div class="modal-content">
    <h2>Incoming Call</h2>
    <p id="callerName">Someone is calling you...</p>
    <div class="modal-buttons">
      <button id="acceptCallBtn" class="success">✓ Accept</button>
      <button id="rejectCallBtn" class="danger">✖ Decline</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
